<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MEM-8 synthetic Journey</title>
    <style>
      body {
        font: 18px/1.5 system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 42rem;
        padding: 0 1rem;
      }

      :focus-visible {
        outline: 4px solid #5b45ff;
        outline-offset: 3px;
      }

      label,
      input,
      button,
      [tabindex] {
        display: block;
        margin: 0.75rem 0;
      }

      input,
      button,
      [tabindex] {
        min-height: 2.75rem;
        padding: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Invite a synthetic teammate</h1>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="off" />
      <button type="button">
        <span data-testid="decorative-invite-label">Invite member</span>
      </button>
      <div data-testid="choose-standard-role" tabindex="0">
        Choose standard role
      </div>
      <div class="synthetic-css-fallback" tabindex="0">Review invitation</div>
      <button id="complete" type="button">Send invitation</button>
      <div id="result"></div>
    </main>
    <script>
      for (const element of document.querySelectorAll("[tabindex='0']")) {
        element.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            element.click();
          }
        });
      }

      document.getElementById("complete").addEventListener("click", () => {
        const status = document.createElement("p");
        status.setAttribute("role", "status");
        status.textContent = "Invitation sent";
        document.getElementById("result").replaceChildren(status);
      });
    </script>
  </body>
</html>
