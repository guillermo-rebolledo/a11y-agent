name: Customer accessibility audit

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Fixed MEM-22 proof scenario
        type: choice
        required: true
        default: success
        options:
          - success
          - runner-failure
          - timeout
          - malformed-artifact
          - publisher-failure
          - oidc-revoked

permissions: {}

jobs:
  audit:
    permissions:
      id-token: write
    uses: guillermo-rebolledo/a11y-agent/.github/workflows/customer-audit.yml@0f1968a9a72e52ab1c1abdb1d23c4f4a6b0cdd52
    with:
      audit-run-id: audit-${{ github.run_id }}
      journey-id: journey-invite-member
      commit-sha: ${{ github.sha }}
      trusted-workflow-sha: 0f1968a9a72e52ab1c1abdb1d23c4f4a6b0cdd52
      scenario: ${{ inputs.scenario }}
    secrets:
      synthetic-login-email: ${{ secrets.SYNTHETIC_LOGIN_EMAIL }}
      synthetic-login-password: ${{ secrets.SYNTHETIC_LOGIN_PASSWORD }}
